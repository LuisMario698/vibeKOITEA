<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koi Tea · Tablero</title>
<meta name="description" content="Menú digital de Koi Tea Boba Shop, Puerto Peñasco: tres tableros bilingües con precios en MXN y USD.">
<meta name="theme-color" content="#483D42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Red+Hat+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap&text=KOITEABSHP%C2%B7%20">
<style>
/* ============================================================================
   PLAN · v5 Tablero — "El tablero en tu mano"
   Layout en una línea: el teléfono es la cuarta pantalla de la barra; bisel de
   nogal arriba y abajo, tres tableros de salvia que se deslizan con snap nativo
   y filas bilingües con puntos guía hasta el precio. El mismo renderizador de
   filas dibuja las 3 pantallas del local.

   COLOR (rol · par de texto verificado)
   --board  #DCE5DF salvia clara: superficie del tablero · tinta 11.76 · musgo 6.94 · rojo 5.42
   --band   #AFC0B6 salvia de las pantallas reales · tinta 7.96 · musgo 4.69 (rojo NO: 3.67)
   --band-2 #C9D6CE salvia media: toque/resalte sobre tablero · tinta 10.09 · rojo 4.65
   --cream  #FEF4EB hojas (fichas, info, WhatsApp) · tinta 13.95 · musgo 8.23 · rojo-c 5.28
   --paper  #FFFCF7 papel térmico (comanda y ticket) · tinta 14.79 · rojo-c 5.60
   --ink    #2A2523 texto, trazos, filetes fuertes
   --moss   #3E4D45 texto secundario (segunda lengua, notas)
   --walnut #483D42 nogal: bisel superior, botones primarios · crema 9.57 · ámbar 5.27
   --walnut-2 #3A3236 nogal profundo: barra inferior · ámbar 6.31
   --amber  #E0B07A luz del plafón: texto/indicadores sobre nogal
   --glow   #C39056 plafón (solo decorativo)
   --red    #A33119 precios y acentos sobre salvia clara; fondo de insignias (crema 6.43)
   --red-c  #B83A22 rojo para texto sobre crema/papel
   --koi    #F94E2B solo ilustración (mancha del koi, halos)
   --bezel  #1E1A1B bisel de pantallas · --wall #F1E4D3 muro cálido del local
   --mute   #D8CCC3 texto secundario sobre nogal (6.60)

   TIPOGRAFÍA
   Jost (títulos de tablero en mayúsculas espaciadas, nombres, cuerpo) ·
   Red Hat Mono (precios, puntos guía, comanda; cifras tabulares) ·
   M PLUS Rounded 1c 800 (solo el wordmark KOI TEA · BOBA SHOP).
   Escala: 12 cap · 14 nota · 15 segunda lengua · 16 cuerpo · 19 nombre ·
   22 subtítulo · 28 título · 56 código. Interlineado 1.2 nombres / 1.45 cuerpo.
   ESPACIO: 4 · 8 · 12 · 16 · 24 · 32. RADIOS con intención: 3 (insignias,
   biseles) · 10 (controles) · 16 (tarjetas) · 18 (hojas) · píldora (acciones).
   ========================================================================== */
:root{
  --board:#DCE5DF; --band:#AFC0B6; --band-2:#C9D6CE; --cream:#FEF4EB; --paper:#FFFCF7;
  --ink:#2A2523; --moss:#3E4D45; --walnut:#483D42; --walnut-2:#3A3236; --amber:#E0B07A;
  --glow:#C39056; --red:#A33119; --red-c:#B83A22; --koi:#F94E2B; --bezel:#1E1A1B;
  --wall:#F1E4D3; --mute:#D8CCC3; --line:rgba(42,37,35,.16); --line-2:rgba(42,37,35,.3);
  --f-sans:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-mark:"M PLUS Rounded 1c","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --t-cap:12px; --t-note:14px; --t-sub:15px; --t-body:16px; --t-name:19px; --t-h3:22px; --t-title:28px; --t-code:56px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-tag:3px; --r-ctl:10px; --r-card:16px; --r-sheet:18px;
  --flute:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,.075) 2px 4px,rgba(0,0,0,0) 4px 9px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --focus:var(--ink);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--wall);background-image:radial-gradient(120% 55% at 50% -12%,rgba(195,144,86,.42),rgba(195,144,86,0) 62%),repeating-linear-gradient(90deg,rgba(72,61,66,.05) 0 1px,rgba(0,0,0,0) 1px 26px);color:var(--ink);font:400 var(--t-body)/1.45 var(--f-sans);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
button:disabled{cursor:not-allowed}
img{display:block;max-width:100%}
h1,h2,h3,h4,p,ul,figure{margin:0}
ul{padding:0;list-style:none}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus-visible{outline:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- App (columna máx. 480 px) ---------- */
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--board);overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 3px var(--bezel),0 30px 60px -20px rgba(42,37,35,.45)}}

/* ---------- Encabezado de nogal ---------- */
.hdr,.strip,.bar{background-color:var(--walnut);background-image:var(--flute);color:var(--cream);--focus:var(--amber)}
.hdr{flex:none;padding:max(6px,env(safe-area-inset-top)) 12px 0}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:52px}
.brand{display:flex;align-items:center;gap:10px;min-height:48px;min-width:0;padding:2px 8px 2px 2px;border:0;border-radius:var(--r-ctl);background:none;color:inherit;text-align:left}
.brand-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgba(254,244,235,.85)}
.brand-mark{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:0}
.wm-1{font:800 clamp(15px,4.7vw,19px)/1 var(--f-mark);letter-spacing:.06em;white-space:nowrap}
.wm-2{font:800 9.5px/1 var(--f-mark);letter-spacing:.36em;color:var(--amber);margin-top:5px;white-space:nowrap}
.tools-home{flex:none;min-width:182px;display:flex;justify-content:flex-end}
.tools{display:flex;gap:6px}
.seg{display:flex;border-radius:var(--r-ctl);padding:0;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(254,244,235,.22)}
.seg button{min-width:44px;min-height:44px;padding:0 8px;border:0;border-radius:var(--r-ctl);background:none;color:var(--mute);font:600 13px/1 var(--f-mono);letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;padding:2px 2px 8px;font:500 13px/1.3 var(--f-sans);color:var(--mute)}
.st-now{display:inline-flex;align-items:center;gap:7px;color:var(--cream)}
.st-dot{width:8px;height:8px;border-radius:50%;background:#9FD6B2;box-shadow:0 0 0 3px rgba(159,214,178,.18)}
.is-closed .st-dot{background:var(--amber);box-shadow:0 0 0 3px rgba(224,176,122,.18)}
.st-orig{color:var(--amber)}

/* ---------- Indicador de 3 mini pantallas ---------- */
.strip{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 12px 10px}
.tab{position:relative;display:flex;align-items:center;gap:8px;min-height:52px;min-width:0;padding:6px 6px 6px 8px;border:1px solid transparent;border-radius:var(--r-ctl);background:none;color:var(--mute);text-align:left}
.tab[aria-current="true"]{background:rgba(254,244,235,.09);border-color:rgba(254,244,235,.24);color:var(--cream)}
.tab[aria-current="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--amber)}
.mini{position:relative;flex:none;width:20px;height:34px;border:2px solid #15110F;border-radius:3px;background:var(--band);transition:background-color .2s,box-shadow .2s}
.mini::before{content:"";position:absolute;inset:4px 3px 5px;background:repeating-linear-gradient(180deg,rgba(42,37,35,.6) 0 1.5px,rgba(0,0,0,0) 1.5px 4.5px)}
.mini--2::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:4px;border-radius:1px;background:linear-gradient(90deg,#D7263D,#F39A2B)}
.mini--2::before{top:10px}
.mini--3::before{bottom:13px}
.mini--3::after{content:"";position:absolute;left:3px;right:3px;bottom:4px;height:7px;background:radial-gradient(circle,rgba(42,37,35,.65) 1px,rgba(0,0,0,0) 1.4px) 0 0/4px 3.5px}
.tab[aria-current="true"] .mini{background:var(--board);box-shadow:0 0 0 1px rgba(254,244,235,.25),0 0 14px 2px rgba(224,176,122,.5)}
.tab-txt{display:flex;flex-direction:column;min-width:0}
.tab-n{font:600 11px/1.1 var(--f-mono);color:var(--amber);letter-spacing:.06em}
.tab-l{font:600 14px/1.15 var(--f-sans)}
.tab-l2{display:block}

/* ---------- Tableros (scroll-snap horizontal) ---------- */
.boards{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;background:var(--board)}
.boards::-webkit-scrollbar{display:none}
.board{flex:0 0 100%;width:100%;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scroll-snap-align:start;scroll-snap-stop:always;padding-bottom:var(--s5);scrollbar-width:thin;scrollbar-color:rgba(62,77,69,.35) transparent}
.is-locked .boards,.is-locked .board{overflow:hidden}
.bd-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:18px 16px 10px;background-image:repeating-linear-gradient(90deg,rgba(62,77,69,.07) 0 1px,rgba(0,0,0,0) 1px 24px)}
.bd-kick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 12px;font:600 var(--t-cap)/1.3 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.bd-side{display:inline-flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:none;font-weight:500}
.bd-side .ico{width:16px;height:16px}
.bd-title{font:600 var(--t-title)/1.05 var(--f-sans);letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
.bd-cube{grid-row:2/span 3;grid-column:2;align-self:center;width:48px;height:48px;border-radius:6px;display:grid;place-items:center;color:var(--ink);background:radial-gradient(circle at 50% 42%,#FFFDF8 0,#F7ECDB 72%);box-shadow:inset 0 0 0 1px rgba(42,37,35,.12),0 8px 18px -8px rgba(195,144,86,.9),6px 0 0 -2px #2A2523}
.bd-cube .ico{width:26px;height:26px;stroke-width:1.8}
.bd-desc{font:500 var(--t-body)/1.35 var(--f-sans);color:var(--ink)}
.bd-desc2{font:400 var(--t-sub)/1.35 var(--f-sans);color:var(--moss)}
.col-h{display:flex;justify-content:flex-end;padding:6px 64px 6px 16px;font:600 var(--t-cap)/1 var(--f-mono);letter-spacing:.16em;color:var(--moss)}

/* Puntos guía (líder de tablero) */
.ln{display:flex;align-items:baseline;align-items:last baseline;min-width:0}
.ln-name{flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.ln-dots{flex:1 1 18px;min-width:18px;align-self:last baseline;height:3px;margin:0 8px;background-image:radial-gradient(circle at 1.5px 1.5px,var(--dots,rgba(62,77,69,.8)) 1.25px,rgba(0,0,0,0) 1.7px);background-size:7px 3px;background-repeat:repeat-x;background-position:0 0;transform:translateY(-1px)}
.ln-val{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Filas */
.rows{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center;border-bottom:1px solid var(--line)}
.row-main{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;min-height:76px;padding:12px 2px 12px 16px;border:0;background:none;text-align:left;transition:background-color .15s}
.row-main:active{background:var(--band-2)}
.row-main:focus-visible,.feat-main:focus-visible,.visit:focus-visible,.opt:focus-visible{outline-offset:-3px}
.row-cup{position:relative;width:40px;height:54px;display:grid;place-items:center}
.row-cup::before{content:"";position:absolute;left:1px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--c);opacity:.32}
.row-cup svg{position:relative;width:auto;height:52px}
.row-name{font:500 var(--t-name)/1.2 var(--f-sans)}
.row-price{font:600 17px/1.2 var(--f-mono);color:var(--red)}
.row-sub{display:block;margin-top:2px;font:400 var(--t-sub)/1.3 var(--f-sans);color:var(--moss)}
.row-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 7px 3px;border-radius:var(--r-tag);font:600 11.5px/1.1 var(--f-sans);letter-spacing:.08em;text-transform:uppercase}
.tag .ico{width:12px;height:12px;stroke-width:2.4}
.tag--casa{background:var(--ink);color:var(--cream)}
.tag--rev{box-shadow:inset 0 0 0 1.5px var(--moss);color:var(--ink)}
.tag--out{background:var(--red);color:var(--cream)}
.row.is-out .row-cup svg{filter:grayscale(1);opacity:.5}
.row.is-out .row-price{color:var(--moss)}
.qa{position:relative;justify-self:center;width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--ink);display:grid;place-items:center}
.qa::before{content:"";position:absolute;inset:6px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink);transition:background-color .15s,transform .15s}
.qa .ico{position:relative;width:20px;height:20px;stroke-width:2.4}

.qa:active::before{transform:scale(.9)}
.qa.is-done{color:var(--cream)}
.qa.is-done::before{background:var(--ink)}
.qa--out{width:48px;height:48px}
.qa--out::before{display:none}

/* Destacada: Koi Tea */
.feat{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center;margin:2px 12px 16px;border-radius:var(--r-card);background:var(--cream);box-shadow:0 0 0 1px rgba(42,37,35,.1),0 14px 26px -18px rgba(163,49,25,.65)}
.feat-main{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;padding:14px 2px 14px 12px;border:0;border-radius:var(--r-card) 0 0 var(--r-card);background:none;text-align:left}

.feat-cup{position:relative;height:118px;display:grid;place-items:center}
.feat-cup::before{content:"";position:absolute;width:84px;height:84px;top:26px;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--c2) 0,var(--c1) 100%);opacity:.38}
.feat-cup svg{position:relative;height:116px;width:auto}
.feat-txt{display:block;min-width:0}
.feat-kick{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:8px}
.feat-k2{font:500 13px/1.2 var(--f-sans);color:var(--moss)}
.feat-name{font:600 26px/1.1 var(--f-sans);padding-bottom:7px;background:linear-gradient(90deg,var(--c1),var(--c2)) 0 100%/72px 4px no-repeat}
.feat .ln-val{font:600 18px/1.1 var(--f-mono);color:var(--red)}
.feat-sub{display:block;margin-top:6px;font:400 var(--t-sub)/1.3 var(--f-sans);color:var(--moss)}
.feat-desc{display:block;margin-top:6px;font:400 var(--t-note)/1.4 var(--f-sans);color:var(--ink)}
.photo{position:relative;margin:0 12px 14px;border-radius:var(--r-card);overflow:hidden;background:var(--band)}
.photo img{width:100%;height:auto;aspect-ratio:16/8;object-fit:cover;object-position:50% 62%}
.photo figcaption{padding:8px 12px;font:500 13px/1.3 var(--f-sans);color:var(--ink);background:var(--band-2)}

/* Toppings (tablero 3) */
.tps{margin-top:var(--s5);padding:0 16px}
.tps-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px;padding-bottom:6px;border-bottom:2px solid var(--ink);font:600 var(--t-h3)/1.1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase}
.tps-h small{font:400 var(--t-sub) var(--f-sans);letter-spacing:.02em;text-transform:none;color:var(--moss)}
.tps-rule{margin-top:10px;font:500 var(--t-body)/1.35 var(--f-sans)}
.tps-rule2{font:400 var(--t-sub)/1.35 var(--f-sans);color:var(--moss)}
.tp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin-top:14px}
.tp-g--tapioca{grid-column:1/-1}
.tp-h{margin:10px 0 4px;font:600 13px/1.25 var(--f-sans);letter-spacing:.12em;text-transform:uppercase}
.tp-h small{display:block;font:400 13px/1.3 var(--f-sans);letter-spacing:.02em;text-transform:none;color:var(--moss)}
.tp{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tp svg{width:16px;height:16px}
.tp-n{font:500 var(--t-body)/1.2 var(--f-sans)}
.tp-n2{grid-column:2;font:400 14px/1.25 var(--f-sans);color:var(--moss)}
.tp .tag{grid-column:2;justify-self:start;margin-top:4px}

/* Pie de tablero */
.bd-foot{display:grid;gap:14px;padding:22px 16px 6px}
.fn{font:500 var(--t-body)/1.35 var(--f-sans)}
.fn2{font:400 var(--t-sub)/1.35 var(--f-sans);color:var(--moss)}
.teaser{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:64px;padding:12px 12px 12px 14px;border:0;border-radius:var(--r-card);background-color:var(--walnut);background-image:var(--flute);color:var(--cream);text-align:left;--focus:var(--ink)}
.teaser strong{display:block;font:600 var(--t-body)/1.25 var(--f-sans)}
.teaser span span{display:block;margin-top:2px;font:400 14px/1.3 var(--f-sans);color:var(--mute)}
.wall-ico{display:flex;gap:3px;align-items:flex-end;padding:8px 6px 6px;border-radius:6px;background:linear-gradient(180deg,rgba(195,144,86,.55),rgba(195,144,86,.15))}
.wall-ico i{width:10px;height:18px;border:1.5px solid #15110F;border-radius:1.5px;background:var(--band)}
.wall-ico i.on{background:var(--board);box-shadow:0 0 8px 1px rgba(224,176,122,.9)}
.legal{font:400 13px/1.45 var(--f-sans);color:var(--moss)}
.visit{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;padding:10px 8px 10px 4px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.visit strong{display:block;font:600 15px/1.3 var(--f-sans)}
.visit span span{display:block;font:400 14px/1.35 var(--f-sans);color:var(--moss)}
.next-b{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px 8px 16px;border:0;border-radius:var(--r-card);box-shadow:inset 0 0 0 2px var(--ink);background:none;color:var(--ink);text-align:left}
.next-b span{flex:1;display:grid}
.next-b small{font:600 var(--t-cap)/1.3 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.next-b strong{font:600 18px/1.25 var(--f-sans)}
.next-b .ico{width:24px;height:24px}
.merch{margin-top:6px;border-radius:var(--r-card);overflow:hidden;background:var(--cream);box-shadow:0 0 0 1px rgba(42,37,35,.1)}
.merch img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:50% 40%}
.merch figcaption{display:grid;gap:2px;padding:12px 14px 14px}
.merch strong{font:600 17px/1.25 var(--f-sans)}
.merch span{font:400 15px/1.35 var(--f-sans);color:var(--moss)}

/* ---------- Barra inferior ---------- */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background-color:var(--walnut-2)}
.scr-btn{display:flex;align-items:center;gap:8px;min-height:48px;min-width:48px;padding:0 12px;border:1px solid rgba(254,244,235,.3);border-radius:var(--r-ctl);background:none;color:var(--cream);font:600 15px/1.1 var(--f-sans)}
.cart-btn{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 12px 6px 18px;border:0;border-radius:999px;background:var(--cream);color:var(--ink);text-align:left;--focus:var(--amber)}
.cart-btn .ico{width:24px;height:24px}
.cb-ico{position:relative;flex:none;display:grid;place-items:center;width:28px;height:30px}
.cb-n{position:absolute;top:-7px;right:-11px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--red);color:var(--cream);font:700 12px/21px var(--f-mono);text-align:center;box-shadow:0 0 0 2px var(--cream)}
.cb-n.is-zero{display:none}
.cb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cb-l{font:600 16px/1.2 var(--f-sans);white-space:nowrap}
.cb-t{font:600 15px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--red);white-space:nowrap}
.cb-t.is-empty{font:500 13px/1.15 var(--f-sans);color:var(--moss)}
.cart-btn .cb-go{flex:none;width:20px;height:20px;color:var(--moss)}
.cart-btn.bump{animation:bump .32s var(--ease)}
@keyframes bump{40%{transform:scale(1.045)}}
@media (max-width:380px){.tab{gap:6px;padding:6px 4px 6px 6px}.mini{width:16px;height:28px}.mini::before{inset:3px 2px 4px}.tab-l{font-size:13px}}
@media (max-width:349px){.scr-btn .lbl{display:none}.hdr,.strip,.bar{padding-left:8px;padding-right:8px}.hdr-row{gap:6px}.brand{gap:8px;padding:2px 4px 2px 2px}.brand-logo{width:32px;height:32px}.wm-2{font-size:8.5px;letter-spacing:.2em}.strip{gap:4px}}

/* Aviso flotante */
.toast{position:absolute;left:12px;right:12px;bottom:84px;z-index:5;display:flex;justify-content:center;pointer-events:none}
.toast-in{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:100%;padding:6px 6px 6px 16px;border-radius:12px;background:var(--ink);color:var(--cream);font:500 15px/1.3 var(--f-sans);box-shadow:0 12px 28px -10px rgba(0,0,0,.55);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s var(--ease);--focus:var(--amber)}
.toast.is-on .toast-in{opacity:1;transform:none}
.toast-in button{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--amber);font:600 15px var(--f-sans)}
.toast:empty{display:none}

/* ---------- Capas (diálogos) ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.layer.is-closing{pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(30,24,22,.5);opacity:0;transition:opacity .22s}
.layer.is-open .scrim{opacity:1}
.sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:480px;max-height:calc(100% - 36px);background:var(--cream);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -10px 34px rgba(30,24,22,.25);transform:translateY(104%);transition:transform .26s var(--ease)}
.sheet--tall{height:calc(100% - 36px)}
.layer.is-open .sheet{transform:none}
.sheet-top{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 6px 12px}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(42,37,35,.22)}
.slot .seg{background:rgba(42,37,35,.06);box-shadow:inset 0 0 0 1px var(--line-2)}
.slot .seg button{color:var(--ink)}
.slot .seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.x{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(42,37,35,.07);color:var(--ink)}

.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 20px}
.sheet-foot{flex:none;padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:inherit;border-radius:0}
.sheet-foot:empty{display:none}

/* Ficha de bebida */
.dk-head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;padding:2px 0 12px}
.dk-cup{position:relative;height:124px;display:grid;place-items:center}
.dk-cup::before{content:"";position:absolute;top:30px;width:88px;height:88px;border-radius:50%;background:var(--c);opacity:.3}
.dk-cup svg{position:relative;height:122px;width:auto;transition:opacity .15s}
.dk-cup.is-swap svg{opacity:.35}
.dk-kick{font:600 var(--t-cap)/1.3 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.dk-title{margin:4px 0 2px;font:600 var(--t-title)/1.1 var(--f-sans)}
.dk-sub{font:400 var(--t-body)/1.3 var(--f-sans);color:var(--moss)}
.dk-head .row-tags{margin-top:8px}
.dk-desc{font:400 var(--t-body)/1.5 var(--f-sans)}
.link-scr{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:10px;padding:8px 10px 8px 12px;border:1.5px solid var(--ink);border-radius:var(--r-ctl);background:none;color:var(--ink);font:600 15px/1.25 var(--f-sans);text-align:left}
.link-scr span{flex:1}

.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding-bottom:6px;border-bottom:2px solid var(--ink);font:600 13px/1.25 var(--f-sans);letter-spacing:.16em;text-transform:uppercase}
.sec-h small{font:400 14px/1.25 var(--f-sans);letter-spacing:.02em;text-transform:none;color:var(--moss)}
.sec-h em{margin-left:auto;font:500 12px/1.25 var(--f-mono);font-style:normal;letter-spacing:0;text-transform:none;color:var(--moss)}
.sub-h{margin:12px 0 0;padding:0 0 2px 34px;font:600 12px/1.3 var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
.sub-h small{font:400 12px var(--f-sans);letter-spacing:.02em;text-transform:none}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:center;width:100%;min-height:48px;padding:6px 6px 6px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 17px/1.25 var(--f-sans);text-align:left;transition:background-color .15s}
.opt--top{grid-template-columns:22px 16px minmax(0,1fr)}

.opt-mk{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center}
.opt--top .opt-mk{border-radius:4px}
.opt-mk .ico{width:14px;height:14px;stroke-width:3;opacity:0}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{background:rgba(175,192,182,.38);font-weight:600}
.opt[aria-checked="true"] .opt-mk{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 5px var(--cream);background:var(--ink)}
.opt[aria-pressed="true"] .opt-mk{background:var(--ink);color:var(--cream)}
.opt[aria-pressed="true"] .opt-mk .ico{opacity:1}
.opt .ln-val{font:500 15px/1.2 var(--f-mono);color:var(--moss)}
.opt[aria-checked="true"] .ln-val,.opt[aria-pressed="true"] .ln-val{font-weight:600;color:var(--red)}
.opt:disabled{color:#8C837E}
.opt:disabled .opt-mk{box-shadow:inset 0 0 0 2px #B9B1AB}
.opt:disabled .ln-val{color:#8C837E}
.opts.is-max .opt[aria-pressed="false"]:not(:disabled){color:var(--moss)}
.tg{width:16px;height:16px}
.cubes{display:inline-flex;gap:3px;vertical-align:middle}
.cubes i{width:9px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1.5px currentColor;background:rgba(255,255,255,.7)}
.msg{min-height:0;margin:6px 0 0;font:500 14px/1.35 var(--f-sans);color:var(--red-c)}
.msg:empty{display:none}
.dk-note{margin-top:20px;font:400 13px/1.45 var(--f-sans);color:var(--moss)}
.dk-out{margin-top:18px;padding:14px;border-radius:var(--r-card);background:rgba(175,192,182,.35)}
.dk-out p{font:500 var(--t-body)/1.4 var(--f-sans)}
.dk-out .alts{display:grid;gap:8px;margin-top:10px}
.alt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;padding:6px 10px;border:1.5px solid var(--ink);border-radius:var(--r-ctl);background:var(--cream);text-align:left;font:600 16px/1.2 var(--f-sans)}
.alt svg{height:44px;width:auto}
.alt .ln-val{font:600 15px var(--f-mono);color:var(--red-c)}
.pricebar .ln-name{font:500 14px/1.2 var(--f-sans);color:var(--moss)}
.pricebar .ln-val{font:600 19px/1.2 var(--f-mono);color:var(--red-c)}
.pricebar .eq{display:block;text-align:right;font:500 13px/1.3 var(--f-mono);color:var(--moss)}
.actions{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty{flex:none;display:flex;align-items:center;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.qty button{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--ink)}
.qty button:disabled{color:#A39A94}
.qty .ico{width:18px;height:18px;stroke-width:2.4}
.qty output,.qty .q{min-width:26px;text-align:center;font:600 17px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border:0;border-radius:999px;font:600 17px/1.15 var(--f-sans);text-align:center}
.btn--pri{flex:1;background:var(--walnut);color:var(--cream)}

.btn--pri:disabled{background:#B5ACA7;color:#2A2523}
.btn--sec{background:none;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}

.btn .ico{width:20px;height:20px}
.btn small{display:block;font:400 13px/1.2 var(--f-sans);opacity:.85}

/* Comanda (carrito) */
.sheet--paper{background:var(--paper)}
.sheet--paper::before{content:"";position:absolute;left:0;right:0;top:-9px;height:10px;background:linear-gradient(135deg,var(--paper) 6px,rgba(0,0,0,0) 0) 0 0/12px 10px repeat-x,linear-gradient(225deg,var(--paper) 6px,rgba(0,0,0,0) 0) 0 0/12px 10px repeat-x}
.sheet--paper{border-radius:0}
.pp-kick{font:600 var(--t-cap)/1.3 var(--f-mono);letter-spacing:.22em;color:var(--moss)}
.pp-title{margin-top:2px;font:600 26px/1.15 var(--f-sans)}
.pp-meta{margin-top:2px;font:500 14px/1.35 var(--f-mono);color:var(--moss)}
.pp-lines{margin-top:12px;border-top:2px solid var(--ink)}
.pl{padding:14px 0 12px;border-bottom:1.5px dashed rgba(42,37,35,.4)}
.pl .ln-name{font:600 17px/1.25 var(--f-mono)}
.pl .ln-val{font:600 17px/1.25 var(--f-mono)}
.pl-q{color:var(--red-c)}
.pl-sub{margin-top:2px;font:400 14px/1.35 var(--f-sans);color:var(--moss)}
.pl-desc{margin-top:4px;font:400 15px/1.45 var(--f-mono)}
.pl-es{margin-top:4px;font:400 14px/1.4 var(--f-mono);color:var(--moss)}
.pl-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.pl-ctl .grow{flex:1}
.lnk{min-height:44px;padding:0 12px;border:0;border-radius:var(--r-ctl);background:none;color:var(--ink);font:600 15px/1 var(--f-sans);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}

.pp-total{margin-top:6px;padding:12px 0 4px;border-top:3px double var(--ink)}
.pp-total .ln-name,.pp-total .ln-val{font:700 21px/1.2 var(--f-mono)}
.pp-eq{text-align:right;font:500 15px/1.4 var(--f-mono);color:var(--moss)}
.undo{display:flex;align-items:center;gap:8px;margin:4px 0 10px;padding:4px 4px 4px 12px;border-radius:var(--r-ctl);background:rgba(175,192,182,.4);font:500 15px/1.3 var(--f-sans)}
.undo span{flex:1}
.empty{display:grid;justify-items:start;gap:10px;padding:8px 0 12px}
.empty svg{height:120px;width:auto}
.empty h2{font:600 24px/1.2 var(--f-sans)}
.empty p{font:400 var(--t-body)/1.5 var(--f-sans);color:var(--ink)}
.foot-2{display:grid;gap:8px}
.foot-2 .btn{width:100%}

/* Ticket "Mostrar en caja" */
.full{position:relative;display:flex;flex-direction:column;width:100%;max-width:480px;height:100%;opacity:0;transform:translateY(18px);transition:opacity .22s,transform .26s var(--ease)}
.layer.is-open .full{opacity:1;transform:none}
.full--counter{background-color:var(--walnut);background-image:var(--flute);color:var(--cream);--focus:var(--amber)}
.full--counter .sheet-top{padding-top:max(10px,env(safe-area-inset-top))}
.full--counter .x{background:rgba(254,244,235,.12);color:var(--cream)}
.full--counter .slot .seg{background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px rgba(254,244,235,.25)}
.full--counter .slot .seg button{color:var(--mute)}
.full--counter .slot .seg button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.tk-wrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 22px}
.tk{position:relative;width:100%;max-width:370px;margin:10px auto 6px;padding:22px 20px 26px;background:var(--paper);color:var(--ink);font-family:var(--f-mono);box-shadow:0 18px 36px -12px rgba(0,0,0,.55);--focus:var(--ink)}
.tk::before,.tk::after{content:"";position:absolute;left:0;right:0;height:10px}
.tk::before{top:-9px;background:linear-gradient(135deg,var(--paper) 6px,rgba(0,0,0,0) 0) 0 0/12px 10px repeat-x,linear-gradient(225deg,var(--paper) 6px,rgba(0,0,0,0) 0) 0 0/12px 10px repeat-x}
.tk::after{bottom:-9px;background:linear-gradient(45deg,var(--paper) 6px,rgba(0,0,0,0) 0) 0 0/12px 10px repeat-x,linear-gradient(315deg,var(--paper) 6px,rgba(0,0,0,0) 0) 0 0/12px 10px repeat-x}
.tk-brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tk-brand .wm-1{font-size:22px}
.tk-brand .wm-2{color:var(--ink);font-size:10px}
.tk-c{text-align:center;font:500 14px/1.45 var(--f-mono);color:var(--moss)}
.tk-cut{margin:14px 0;border:0;border-top:1.5px dashed rgba(42,37,35,.45)}
.tk-h{text-align:center;font:700 15px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.tk-h2{text-align:center;font:500 13px/1.3 var(--f-mono);color:var(--moss)}
.tk-code{margin:10px 0 6px;text-align:center;font:700 var(--t-code)/1 var(--f-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tk-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tk-mode button{min-height:44px;padding:4px 6px;border:0;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--ink);background:none;color:var(--ink);font:600 14px/1.15 var(--f-mono)}
.tk-mode button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.tk-colh{text-align:right;font:600 11.5px/1.3 var(--f-mono);letter-spacing:.14em;color:var(--moss)}
.tk-lines li{padding:8px 0;border-bottom:1px dotted rgba(42,37,35,.45)}
.tk-lines .ln-name,.tk-lines .ln-val{font:600 16px/1.3 var(--f-mono)}
.tk-d{margin-top:2px;font:400 14px/1.4 var(--f-mono)}
.tk-es{margin-top:3px;font:400 14px/1.4 var(--f-mono);color:var(--moss)}
.tk-es b{font-weight:600;color:var(--ink)}
.tk-total{margin-top:10px;padding-top:10px;border-top:3px double var(--ink)}
.tk-total .ln-name,.tk-total .ln-val{font:700 20px/1.2 var(--f-mono)}
.tk-pay{display:grid;gap:2px;margin-top:12px;padding:8px 10px;text-align:center;box-shadow:inset 0 0 0 2px var(--ink)}
.tk-pay span{font:700 16px/1.25 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.tk-pay small{font:500 13px/1.3 var(--f-mono);color:var(--moss)}
.tk-foot{padding:12px 16px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(30,24,22,.35)}
.tk-foot .btn--sec{box-shadow:inset 0 0 0 1.5px rgba(254,244,235,.7);color:var(--cream)}
.tk-foot .btn--pri{background:var(--cream);color:var(--ink)}

/* WhatsApp */
.wa-lead{margin-top:6px;font:400 var(--t-body)/1.45 var(--f-sans)}
.closed-note{margin-top:12px;padding:10px 12px;border-radius:var(--r-ctl);background:rgba(224,176,122,.35);font:500 15px/1.4 var(--f-sans)}
.fld{display:grid;gap:6px;margin-top:14px}
.fld label{font:600 15px/1.2 var(--f-sans)}
.fld label small{font:400 14px var(--f-sans);color:var(--moss)}
.fld input{width:100%;min-height:48px;padding:10px 12px;border:0;border-radius:var(--r-ctl);background:#fff;box-shadow:inset 0 0 0 1.5px var(--moss);font:400 17px/1.2 var(--f-sans);color:var(--ink)}
.fld input:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.fld input::placeholder{color:#6B6560}
.pv-l{margin-top:18px;font:600 var(--t-cap)/1.3 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.bubble{position:relative;margin-top:8px;padding:10px 12px 12px;border-radius:14px 14px 4px 14px;background:#E3EEDF;box-shadow:0 1px 0 rgba(42,37,35,.15)}
.bubble textarea{display:block;width:100%;padding:0;border:0;background:none;resize:none;overflow:hidden;field-sizing:content;font:400 15px/1.45 var(--f-sans);color:var(--ink)}
.bubble textarea:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:4px}
.wa-note{margin-top:10px;font:400 14px/1.45 var(--f-sans);color:var(--moss)}
.copy-st{min-height:20px;margin-top:8px;font:600 15px/1.35 var(--f-sans);color:var(--moss)}
.copy-st:empty{display:none}

/* Info */
.in-head{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.in-logo{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--ink)}
.in-head h2{font:600 24px/1.15 var(--f-sans)}
.in-tag{margin-top:4px;font:italic 400 var(--t-body)/1.4 var(--f-sans)}
.in-or{margin-top:2px;font:500 15px/1.35 var(--f-sans);color:var(--moss)}
.in-rows{margin-top:16px;border-top:2px solid var(--ink)}
.in-rows li{padding:12px 0;border-bottom:1px solid var(--line)}
.in-rows .ln-name{font:500 var(--t-body)/1.3 var(--f-sans)}
.in-rows .ln-val{font:600 15px/1.3 var(--f-mono)}
.in-addr{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;margin-top:14px;font:400 var(--t-body)/1.45 var(--f-sans)}
.in-photo{margin-top:16px;border-radius:var(--r-card);overflow:hidden;background:var(--band)}
.in-photo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;object-position:50% 36%}
.in-photo figcaption{padding:8px 12px;font:500 14px/1.35 var(--f-sans);background:var(--band-2)}
.in-notes{display:grid;gap:4px;margin-top:14px}

/* ---------- Pantallas del local ---------- */
.full--wall{background:var(--wall)}
.sv{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 22px}
.sv h2{font:600 24px/1.15 var(--f-sans)}
.sv-lead{margin-top:6px;font:500 17px/1.4 var(--f-sans)}
.sv-ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.seg--l{background:rgba(42,37,35,.06);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg--l button{color:var(--ink);font:600 14px/1 var(--f-sans);letter-spacing:0;padding:0 12px}
.seg--l button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);background:none;color:var(--ink);font:600 14px/1 var(--f-sans)}
.chip .ico{width:18px;height:18px}

    var s = lang === 'en' ? tp.en.replace(/ popping boba$/, '').replace(/ jelly$/, '') : tp.es.replace(/^Perlas explosivas de /, '').replace(/^Jelly de /, '');

  function shopState() {

      var h = 0, m = 0; parts.forEach(function (x) { if (x.type === 'hour') h = +x.value; if (x.type === 'minute') m = +x.value; });

  function qrSVG() {
    var N = 25, seed = 20261101, d = '';

    function finder(x, y) {
      for (var i = 0; i < 3; i++) {
        var lx = x - F[i][0], ly = y - F[i][1];
        if (lx >= -1 && lx <= 7 && ly >= -1 && ly <= 7) {

          return (lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4)) ? 1 : 0;
        }

      return -1;
    }
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {

  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (stack.length) { e.preventDefault(); closeLayer(); } else hideToast(true); return; }
    var r = e.target.closest && e.target.closest('[role="radio"]');
    if (r && /^(ArrowDown|ArrowRight|ArrowUp|ArrowLeft|Home|End)$/.test(e.key)) {
      var g = r.closest('[role="radiogroup"]'); if (!g) return;
      var items = $$('[role="radio"]:not([disabled])', g), i = items.indexOf(r);
      if (e.key === 'Home') i = 0; else if (e.key === 'End') i = items.length - 1;
      else i = (i + (e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length;
      e.preventDefault(); items[i].click(); items[i].focus();
    }
  });
  var boardsEl = $('#boards'), rafB = 0;
  boardsEl.addEventListener('scroll', function () {
    if (rafB) return;
    rafB = requestAnimationFrame(function () { rafB = 0; var i = Math.round(boardsEl.scrollLeft / Math.max(1, boardsEl.clientWidth)); if (i !== S.board && i >= 0 && i < 3) setBoard(i); });
  }, { passive: true });
  var rzT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () { boardsEl.scrollLeft = S.board * boardsEl.clientWidth; fitScreens(false); }, 80);
  });

  /* ---------- Arranque ---------- */
  renderChrome();
  renderBoards();
})();
</script>
</body>
