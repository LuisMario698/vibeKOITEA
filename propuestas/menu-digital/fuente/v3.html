<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koi Tea · Menú</title>
<meta name="description" content="Menú Express de Koi Tea Boba Shop, Puerto Peñasco: pide en tres toques, en español o inglés, en pesos o dólares.">
<meta name="theme-color" content="#FEF4EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* PLAN · v3 Express — "Rápido y bilingüe"
   Layout en una línea: tienda de app de delivery con alma de Koi → barra fija (logo + ES/EN + MXN/USD) · portada
   "Hoy en Koi" en bento sobre la celosía · buscador y filtros · pestañas fijas que siguen el scroll · filas con mini-vaso
   y "+" · barra de pedido con el vaso-indicador (se llena con el color de cada bebida) · hojas inferiores y ticket bilingüe.
   Tokens de color (rol · contraste):
     --paper    #FEF4EB  fondo de la app (crema del logo)
     --card     #FFFFFF  superficies: filas, hojas, campos
     --ink      #1E1A18  texto principal y control activo (17.3:1 blanco · 15.9:1 crema)
     --muted    #5E554F  texto secundario (7.3:1 blanco · 6.7:1 crema · 5.7:1 salvia)
     --sage     #DCE5DF  tiles, chips y bandas (salvia de las pantallas del local)
     --sage-ink #2F4A3F  texto sobre salvia (7.5:1)
     --koi      #C2361C  botón principal, texto blanco (5.5:1)
     --price    #B5321B  precios (6.1:1 blanco · 5.6:1 crema)
     --koi-vivid #F94E2B solo ilustración (mancha del koi, popote)
     --lattice  #E9D7BC  marco de celosía del bento (decorativo, sin texto)
     --line #EADFD3 filetes · --ctl #8C7F76 borde de campos (3.6:1) · --ok #2F7A4F punto "Abierto"
     --casa-bg #FCE4DC + --casa-ink #9E2A14 insignia "De la casa" (6.2:1) · --off-bg #ECE6E0 agotado (texto muted 5.9:1)
   Escala tipográfica (Figtree = UI y números tabulares · Zen Maru Gothic = títulos cortos y wordmark redondeado):
     12 · 13.5 · 16 · 19 · 23 · 28 · 64 (código del ticket); interlineado 1.45 cuerpo / 1.15 títulos.
   Espaciado 4·8·12·16·24·32 · radios por rol: tile 7 · tarjeta 14 · control 12 · hoja 22 · pastilla 999.
   Movimiento 150–250 ms (transform/opacity); reduced motion = solo fundidos. */
:root{
  --paper:#FEF4EB;--card:#FFFFFF;--ink:#1E1A18;--muted:#5E554F;--sage:#DCE5DF;--sage-ink:#2F4A3F;
  --koi:#C2361C;--koi-press:#A32C15;--price:#B5321B;--koi-vivid:#F94E2B;--lattice:#E9D7BC;--lattice-edge:#D9C19D;
  --line:#EADFD3;--line-2:#F3ECE4;--ctl:#8C7F76;--chip-edge:#CDBFB3;--casa-bg:#FCE4DC;--casa-ink:#9E2A14;--off-bg:#ECE6E0;
  --ok:#2F7A4F;--blush:#F9E7DD;--scrim:rgba(30,26,24,.5);
  --f-ui:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Figtree",system-ui,sans-serif;
  --t-xs:12px;--t-sm:14px;--t-md:16px;--t-lg:19px;--t-xl:23px;--t-2xl:28px;--t-code:64px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-tile:7px;--r-card:14px;--r-ctl:12px;--r-sheet:22px;--r-pill:999px;
  --sh-bar:0 10px 28px -6px rgba(30,26,24,.38);--sh-sheet:0 -12px 40px rgba(30,26,24,.22);
  --ease:cubic-bezier(.2,.8,.2,1);--d-fast:150ms;--d-mid:220ms;
  --col:480px;--gut:16px;--topbar:64px;--tabs:51px
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--paper);scrollbar-gutter:stable;scroll-padding-top:calc(var(--topbar) + var(--tabs) + 10px);scroll-padding-bottom:104px}
html.locked,html.locked body{overflow:hidden}
body{margin:0;font-family:var(--f-ui);font-size:var(--t-md);line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-synthesis:none}
img,svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,figure,blockquote,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}
.muted{color:var(--muted)}

/* columna centrada en pantallas anchas, sobre la retícula de la celosía */
.app{position:relative;max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);padding-top:var(--topbar);padding-bottom:calc(118px + env(safe-area-inset-bottom))}
@media (min-width:601px){
  html{background:var(--sage)}
  body{background-color:var(--sage);background-image:linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px);background-size:58px 58px;background-position:center top}
  .app{box-shadow:0 0 0 1px rgba(47,74,63,.16),0 30px 80px -24px rgba(47,74,63,.4)}
}

/* barra superior fija */
.top{position:fixed;top:0;left:0;right:0;max-width:var(--col);margin:0 auto;z-index:30;display:flex;align-items:center;gap:10px;padding:10px var(--gut);background:var(--paper);border-bottom:1px solid transparent;transition:border-color var(--d-fast),box-shadow var(--d-fast)}
.top.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 18px -14px rgba(30,26,24,.45)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1.5px var(--ink)}
.wordmark{min-width:0;line-height:1}
.wm{display:block;font-family:var(--f-round);font-weight:900;font-size:19px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.wm-sub{display:block;margin-top:4px;font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.toggles{display:flex;gap:6px;flex:none}
.seg{display:flex;border-radius:var(--r-pill);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg button{min-width:44px;min-height:44px;padding:0 8px;border-radius:var(--r-pill);font-weight:800;font-size:13.5px;letter-spacing:.03em;text-align:center;transition:background-color var(--d-fast),color var(--d-fast)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.soft{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:419px){.wm-sub{display:none}}
@media (max-width:369px){.wordmark{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}}

/* intro: estado, ubicación y origen */
.intro{padding:4px var(--gut) 0}
.infobar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%;min-height:48px;padding:8px 10px 8px 12px;border-radius:var(--r-card);background:var(--sage);color:var(--sage-ink);font-size:var(--t-sm);text-align:left}
.infobar .st{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.infobar .st b{font-weight:800}
.infobar .pl{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(47,122,79,.2)}
.st .koi{margin:-6px -2px -6px -4px}
.again{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px;padding:8px 8px 8px 10px;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line)}
.again .cups{display:flex;padding-right:6px}
.again .cups svg{width:26px;height:auto;margin-right:-7px}
.again b{display:block;font-weight:800;font-size:15px;line-height:1.25}
.again .s{display:block;font-size:var(--t-sm);color:var(--muted);line-height:1.3}
.origin{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:var(--t-sm);color:var(--muted)}

/* Hoy en Koi: bento sobre la celosía */
.today{padding:0 var(--gut)}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.h2{font-family:var(--f-round);font-weight:700;font-size:var(--t-xl);line-height:1.15;letter-spacing:.01em}
.h2row .aside{font-size:var(--t-sm);color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,78px);grid-template-areas:"koi koi rev rev" "koi koi rev rev" "koi koi new new" "top top mer mer";gap:5px;padding:5px;border-radius:12px;background:var(--lattice);box-shadow:inset 0 0 0 1px var(--lattice-edge),0 1px 0 rgba(255,255,255,.7)}
.tile{position:relative;display:block;min-width:0;border-radius:var(--r-tile);overflow:hidden;text-align:left;color:var(--ink);background:var(--card)}
.tile:active{filter:brightness(.97)}
.t-koi{grid-area:koi;color:#fff;background:linear-gradient(180deg,#F7A63D 0%,#F39233 24%,#EA6A30 42%,#DD3D37 54%,#D7263D 62%,#B71C35 100%)}
.t-koi .tile-main{position:absolute;inset:0;display:block;border-radius:inherit}
.t-koi .badge{position:absolute;top:10px;left:10px;z-index:1}
.t-koi .t-cup{position:absolute;top:6px;right:2px;width:74px;filter:drop-shadow(0 6px 10px rgba(120,20,20,.25))}
.t-koi .t-cup svg{width:100%;height:auto}
.t-koi .t-txt{position:absolute;left:12px;right:12px;bottom:62px}
.t-koi .t-name{display:block;font-family:var(--f-round);font-weight:900;font-size:26px;line-height:1.05}
.t-koi .t-desc{display:block;margin-top:5px;font-size:13px;font-weight:600;line-height:1.3}
.t-koi .t-price{position:absolute;left:12px;bottom:21px;font-size:var(--t-lg);font-weight:800}
.t-add{position:absolute;right:10px;bottom:10px;z-index:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);box-shadow:0 4px 12px rgba(100,10,20,.3);transition:transform var(--d-fast) var(--ease)}
.t-add:active{transform:scale(.92)}
.t-koi :focus-visible{outline-color:#fff}
.t-rev{grid-area:rev;display:flex;flex-direction:column;justify-content:space-between;padding:11px 12px 10px;background:var(--sage);color:var(--sage-ink)}
.t-rev .tt{display:flex;align-items:flex-start;gap:6px;font-weight:800;font-size:15px;line-height:1.2}
.t-rev .tt .ic{margin-top:1px}
.t-rev .cups{display:flex;align-items:flex-end;margin:4px 0 2px}
.t-rev .cups svg{width:34px;height:auto;margin-right:-5px}
.t-rev .ts{display:block;font-size:var(--t-xs);font-weight:700}
.t-new{grid-area:new}
.t-new,.t-top{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 10px 8px 12px}
.t-new b,.t-top b{display:block;font-weight:800;font-size:16px;line-height:1.15}
.t-new .ts,.t-top .ts{display:block;font-size:var(--t-xs);font-weight:600;color:var(--muted)}
.tl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.t-new svg.mini{width:38px;height:auto;flex:none}
.t-top{grid-area:top;background:var(--blush)}
.gums{display:flex;flex:none}
.gums .gum{width:17px;height:17px;margin-left:-4px}
.t-mer{grid-area:mer;background:#3A302B}
.t-mer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.t-mer .lbl{position:absolute;left:7px;bottom:7px;max-width:calc(100% - 14px);padding:4px 8px;border-radius:8px;background:var(--paper);font-size:var(--t-xs);font-weight:800;line-height:1.2}
.t-mer .lbl span{display:block;font-weight:600;color:var(--muted)}

/* insignias */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:800;line-height:1.2;white-space:nowrap}
.badge.casa{background:var(--casa-bg);color:var(--casa-ink)}
.badge.rev{background:var(--sage);color:var(--sage-ink)}
.badge.off{background:var(--off-bg);color:var(--muted);padding-left:8px}
.t-koi .badge.casa{background:var(--paper);color:var(--casa-ink)}

/* menú: buscador, filtros y pestañas */
.menu-head{padding:0 var(--gut)}
.search{position:relative;display:flex;align-items:center;margin:0 var(--gut)}
.search>.ic{position:absolute;left:15px;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:50px;padding:0 52px 0 44px;border:1.5px solid var(--ctl);border-radius:var(--r-pill);background:var(--card);font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted);opacity:1}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input:focus-visible{outline:3px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.q-clear{position:absolute;right:3px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px var(--gut) 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-pill);background:var(--sage);color:var(--sage-ink);font-weight:700;font-size:var(--t-sm);transition:background-color var(--d-fast),color var(--d-fast)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip .ck{display:none}
.chip[aria-pressed="true"] .ck{display:block}
.note{margin:10px var(--gut) 0;font-size:var(--t-xs);color:var(--muted)}
.tabs{position:relative;z-index:20;display:flex;margin-top:12px;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs.stuck{position:fixed;top:var(--topbar);left:0;right:0;max-width:var(--col);margin:0 auto;box-shadow:0 8px 18px -14px rgba(30,26,24,.45)}
.tabs-ph{margin-top:12px}
.tabs-scroll{position:relative;display:flex;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:50px;padding:0 12px;font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap;transition:color var(--d-fast)}
.tab[aria-current="true"]{color:var(--ink)}
.tab-ink{position:absolute;left:0;bottom:0;width:0;height:3px;border-radius:3px 3px 0 0;background:var(--koi);transition:transform var(--d-mid) var(--ease),width var(--d-mid) var(--ease)}
.tab-q{flex:none;width:50px;min-height:50px;display:grid;place-items:center;border-left:1px solid var(--line)}

/* categorías y filas */
.cat{padding:0 var(--gut)}
.cat-head{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;margin:22px 0 10px}
.cube{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#FFFDF8;box-shadow:0 0 0 1px var(--line),0 8px 18px -8px rgba(195,144,86,.75)}
.cat-head h3{font-family:var(--f-round);font-weight:700;font-size:var(--t-lg);line-height:1.15}
.cat-head p{font-size:15px;color:var(--muted)}
.cat-n{font-size:var(--t-sm);font-weight:700;color:var(--muted)}
.rows{background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row-main{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:92px;padding:10px 4px 10px 10px;border-radius:var(--r-card);transition:background-color var(--d-fast)}
.row-main:active{background:var(--line-2)}
.row-cup{position:relative;width:58px;height:74px;display:grid;place-items:center}
.halo{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-22px 0 0 -27px;border-radius:50%;background:var(--c);opacity:.2}
.row-cup svg{position:relative;width:44px;height:auto}
.row.off .row-cup svg{filter:grayscale(1);opacity:.55}
.row-txt{display:block;min-width:0}
.row-name{display:block;font-weight:800;font-size:18px;line-height:1.25}
.row-desc{display:block;margin-top:2px;font-size:var(--t-md);line-height:1.38;color:var(--muted)}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px}
.price{font-weight:800;color:var(--price);font-variant-numeric:tabular-nums}
.row.off .price{color:var(--muted)}
.add{width:44px;height:44px;margin:0 12px 0 2px;border-radius:50%;display:grid;place-items:center;background:var(--koi);color:#fff;transition:transform var(--d-fast) var(--ease),background-color var(--d-fast)}
.add:active{transform:scale(.9)}
.add:disabled{background:var(--off-bg);color:var(--muted)}
.add.done,.t-add.done{background:var(--ink);color:#fff}
.tops{display:grid;gap:14px;padding:14px;background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line)}
.tgroup h4{margin-bottom:8px;font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tgroup ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.tgroup li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:var(--t-sm);font-weight:600}
.tgroup li.off .nm{color:var(--muted);text-decoration:line-through}
.gum{display:inline-block;flex:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 13%,rgba(255,255,255,0) 15%),radial-gradient(circle at 50% 55%,var(--c) 58%,rgba(30,26,24,.18) 100%),var(--c);box-shadow:inset 0 -2px 3px rgba(30,26,24,.18),0 0 0 1px rgba(30,26,24,.28)}
.gum.jelly{border-radius:5px;transform:rotate(-8deg)}
.gum.tapioca{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.4) 0 13%,rgba(255,255,255,0) 15%),#3A2214}
.quote{margin:16px var(--gut) 0;padding:12px 14px;border-radius:var(--r-card);background:var(--sage);color:var(--sage-ink)}
.quote blockquote{font-weight:700;line-height:1.35}
.quote figcaption{margin-top:4px;font-size:var(--t-xs);font-weight:600}
.empty{display:grid;justify-items:center;gap:8px;margin:22px var(--gut) 0;padding:22px 16px;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line);text-align:center}
.empty h3{font-family:var(--f-round);font-weight:700;font-size:var(--t-lg);line-height:1.2}
.empty p{font-size:var(--t-sm);color:var(--muted);max-width:30ch}
.suggest{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0}
.info-line{margin:18px var(--gut) 0;font-size:var(--t-sm);color:var(--muted)}

/* pie del menú */
.foot{margin:30px var(--gut) 0;padding:14px;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line)}
.foot-photo{height:160px;overflow:hidden;border-radius:10px;background:#E9DCCB}
.foot-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.9);transform-origin:28% 66%}
.foot-tag{margin-top:12px;font-family:var(--f-round);font-weight:700;font-size:var(--t-lg);line-height:1.3}
.foot-facts{display:grid;gap:8px;margin-top:12px;font-size:var(--t-sm)}
.foot-facts div{display:flex;align-items:flex-start;gap:8px}
.foot-facts .ic{margin-top:1px;color:var(--sage-ink)}
.foot .btn{width:100%;margin-top:14px}
.fine{margin-top:12px;font-size:var(--t-xs);color:var(--muted);line-height:1.5}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r-pill);font-weight:800;font-size:var(--t-md);line-height:1.15;text-align:center;transition:background-color var(--d-fast),transform var(--d-fast) var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--koi);color:#fff}
.btn.primary:active{background:var(--koi-press)}
.btn.secondary{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost{background:var(--sage);color:var(--sage-ink)}
.btn.sm{min-height:44px;padding:0 16px;font-size:var(--t-sm)}
.btn:disabled{background:var(--off-bg);color:var(--muted);box-shadow:none;transform:none}
.btn small{display:block;font-size:var(--t-xs);font-weight:700}
.wide{width:100%}

/* barra del pedido con el vaso-indicador */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:var(--col);margin:0 auto;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.dock>*{pointer-events:auto}
.cartbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;min-height:66px;padding:8px 12px 8px 8px;border-radius:20px;background:var(--ink);color:#fff;box-shadow:var(--sh-bar);text-align:left;transition:background-color var(--d-mid),color var(--d-mid)}
.cartbar.is-empty{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),0 10px 24px -10px rgba(30,26,24,.4)}
.cupind{width:48px;height:50px;display:grid;place-items:center;border-radius:14px;background:rgba(254,244,235,.1);color:var(--paper)}
.cartbar.is-empty .cupind{background:var(--paper);color:var(--ink)}
.cupind.bump{animation:bump 260ms var(--ease)}
.cupind .band{transform-box:fill-box;transform-origin:50% 100%}
.cupind .band.nb{animation:grow 240ms var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bump{40%{transform:scale(1.12)}to{transform:scale(1)}}
.cb-count{display:block;font-weight:800;font-size:var(--t-md);line-height:1.2}
.cb-sub{display:block;font-size:var(--t-sm);color:#D9CFC6}
.cartbar.is-empty .cb-sub{color:var(--muted)}
.cb-total{font-weight:800;font-size:var(--t-lg)}
.toast{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:8px;padding:8px 8px 8px 10px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 12px 28px -8px rgba(30,26,24,.3);opacity:0;transform:translateY(10px);transition:opacity var(--d-fast),transform var(--d-mid) var(--ease)}
.toast.on{opacity:1;transform:none}
.toast b{display:block;font-size:var(--t-sm);line-height:1.25}
.toast span{display:block;font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.fly{position:fixed;z-index:95;width:14px;height:14px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}

/* hojas inferiores (diálogos) */
.layer{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.layer:not(.on){pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity var(--d-mid)}
.layer.on .scrim{opacity:1}
.sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:var(--col);max-height:calc(100% - 18px);background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--sh-sheet);opacity:0;transform:translateY(36px);transition:opacity var(--d-fast),transform var(--d-mid) var(--ease)}
.layer.on .sheet{opacity:1;transform:none}
.sheet.full{height:100%;max-height:100%;border-radius:0;background:var(--paper)}
.sheet.dragging{transition:none}
.sheet-bar{position:relative;display:flex;align-items:center;gap:6px;flex:none;padding:14px 12px 6px 16px;touch-action:none}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:#D6CBC1}
.sheet.full .grab{display:none}
.sheet-bar .x{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.sheet.full .sheet-bar .x{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 22px}
.sheet-body.fade{animation:fade var(--d-fast) ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet.full .sheet-foot{background:var(--paper)}
.sh-title{font-family:var(--f-round);font-weight:700;font-size:var(--t-xl);line-height:1.15}
.sh-sub{margin-top:4px;font-size:var(--t-sm);color:var(--muted)}
[tabindex="-1"]:focus{outline:none}

/* ficha de bebida */
.dk-hero{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start}
.dk-cup{position:relative;width:104px;height:150px;display:grid;place-items:center}
.dk-cup .halo{width:100px;height:100px;margin:-44px 0 0 -50px;opacity:.24}
.dk-cup svg{position:relative;width:100%;height:auto}
.dk-cup.off svg{filter:grayscale(.9);opacity:.6}
.dk-info{min-width:0;padding-top:2px}
.dk-info .badge{margin:0 4px 6px 0}
.dk-board{margin-top:3px;font-size:var(--t-xs);color:var(--muted)}
.dk-board span{font-weight:800;color:var(--ink)}
.dk-desc{margin-top:6px;font-size:var(--t-md);color:var(--muted);line-height:1.4}
.dk-attrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dk-attrs li{padding:2px 8px;border-radius:var(--r-pill);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-xs);font-weight:700;color:var(--muted)}
.dk-price{margin-top:8px;font-size:var(--t-xl);font-weight:800;color:var(--price);line-height:1.1}
.dk-price .per{font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.dk-alt{display:block;margin-top:3px;font-size:var(--t-sm);font-weight:700;color:var(--muted)}
.tick{display:inline-block;animation:tick 200ms var(--ease)}
@keyframes tick{from{transform:translateY(-5px);opacity:.3}to{transform:none;opacity:1}}
.opt{margin-top:18px}
.opt-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;margin-bottom:8px}
.opt-head h3{font-size:var(--t-md);font-weight:800}
.opt-head .hint{font-size:var(--t-xs);font-weight:600;color:var(--muted)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:var(--r-ctl);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.segs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;padding:4px 2px;border-radius:9px;font-weight:800;font-size:var(--t-sm);line-height:1.15;text-align:center;transition:background-color var(--d-fast),color var(--d-fast)}
.segs button small{font-size:var(--t-xs);font-weight:600;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.segs button[aria-pressed="true"] small{color:#E9E1D9}
.segs .row2{display:flex;align-items:center;gap:6px}
.tg{margin-top:10px}
.tg:first-of-type{margin-top:0}
.tg-name{margin-bottom:6px;font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tchip{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:8px;min-height:50px;padding:5px 8px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--chip-edge);font-size:var(--t-sm);font-weight:700;line-height:1.15;text-align:left;transition:box-shadow var(--d-fast),background-color var(--d-fast)}
.tchip .lab{display:flex;flex-direction:column;min-width:0}
.tchip small{font-size:var(--t-xs);font-weight:800;color:var(--price)}
.tchip[aria-pressed="true"]{background:#FFF7F0;box-shadow:inset 0 0 0 2.5px var(--ink)}
.tchip .ck{position:absolute;top:-6px;right:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}
.tchip:disabled{background:var(--line-2);box-shadow:none;color:var(--muted)}
.tchip:disabled .gum{opacity:.4}
.tchip:disabled small{color:var(--muted)}
.tchip.dim:not([aria-pressed="true"]){opacity:.62}
.opt-msg{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--casa-bg);color:var(--casa-ink);font-size:var(--t-sm);font-weight:700}
.opt-note{display:flex;gap:10px;align-items:center;margin-top:18px;padding:10px 12px;border-radius:12px;background:var(--sage);color:var(--sage-ink);font-size:var(--t-sm);font-weight:600}
.sold{display:grid;gap:10px;margin-top:16px;padding:14px;border-radius:var(--r-card);background:var(--off-bg)}
.sold-top{display:flex;align-items:center;gap:10px}
.sold-top b{display:block;font-weight:800}
.sold-top p{font-size:var(--t-sm);color:var(--muted)}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:60px;padding:6px 12px 6px 6px;border-radius:12px;background:var(--card);text-align:left;font-weight:800}
.alt svg{width:34px;height:auto;margin:0 auto}
.alt .price{font-size:var(--t-sm)}
.dk-foot{display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;flex:none;border-radius:var(--r-pill);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.stepper button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.stepper button:disabled{color:#B4A89E}
.stepper .q{min-width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.grow{flex:1 1 auto;min-width:0}

/* pedido */
.lines{display:grid;margin-top:12px;border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line)}
.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 12px 10px 8px;border-top:1px solid var(--line-2)}
.line:first-child{border-top:0}
.line-cup svg{width:40px;height:auto;margin:2px auto 0}
.line-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.line-name{font-weight:800;font-size:18px;line-height:1.25}
.line-total{font-weight:800;color:var(--price);white-space:nowrap}
.line-desc{margin-top:2px;font-size:15px;color:var(--muted);line-height:1.35}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:var(--t-sm);font-weight:700}
.undo .btn{background:var(--paper);color:var(--ink);flex:none}
.line-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.line-ctl .stepper{margin-right:auto}
.lnk{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--t-sm);font-weight:700}
.lnk:active{background:var(--line-2)}
.lnk.ico{width:44px;padding:0;justify-content:center}
.cart-note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--sage);color:var(--sage-ink);font-size:var(--t-sm);font-weight:600}
.cart-sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cart-sum .lbl{font-weight:800}
.cart-sum .tot{font-size:var(--t-xl);font-weight:800}
.cart-mx{margin-top:2px;text-align:right;font-size:var(--t-sm);color:var(--muted)}
.cart-btns{display:grid;gap:8px;margin-top:10px}
.cart-empty{display:grid;justify-items:center;gap:8px;padding:12px 6px 4px;text-align:center}
.cart-empty img{width:104px;height:104px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px var(--ink)}
.cart-empty p{max-width:32ch;font-size:var(--t-sm);color:var(--muted)}
.last{margin-top:18px;padding:14px;border-radius:var(--r-card);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.last h3{font-size:var(--t-md);font-weight:800}
.last ul{margin:6px 0 10px;font-size:var(--t-sm);color:var(--muted)}

/* ticket bilingüe para caja */
.v-counter .sheet-body{padding:0 0 18px}
.tk-pass{margin:4px 16px 0;padding:18px 16px 16px;border-radius:20px;background:var(--koi);color:#fff;text-align:center}
.tk-kicker{font-size:var(--t-md);font-weight:800;line-height:1.25}
.tk-kicker span{display:block;margin-top:2px;font-size:var(--t-sm);font-weight:600}
.tk-code{margin:8px 0 6px;font-weight:800;font-size:var(--t-code);line-height:1;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.tk-meta{font-size:var(--t-sm);font-weight:600}
.tk-lines{margin:14px 16px 0;background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line)}
.tk-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--line-2)}
.tk-line:first-child{border-top:0}
.tk-q{font-size:var(--t-lg);font-weight:800;line-height:1.2}
.tk-n{font-weight:800;font-size:18px;line-height:1.25}
.tk-p{font-weight:800;white-space:nowrap}
.tk-d{grid-column:2/4;font-size:15px;color:var(--muted)}
.tk-mode{margin:14px 16px 0}
.tk-mode p{margin-bottom:8px;font-weight:800}
.tk-staff{grid-column:2/4;margin-top:6px;padding:6px 9px;border-radius:9px;background:var(--sage);color:var(--sage-ink);font-size:var(--t-sm);line-height:1.35}
.tk-staff b{display:block;font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tk-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:12px 16px 0;padding:14px;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:var(--t-xl);font-weight:800}
.tk-total+.tk-staff{margin:8px 16px 0}
.tk-thanks{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 16px 0;font-family:var(--f-round);font-weight:700;font-size:var(--t-lg)}
.v-counter .fine{margin:10px 16px 0;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* WhatsApp */
.field{margin-top:14px}
.field label{display:block;margin-bottom:6px;font-size:var(--t-sm);font-weight:800}
.field input{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--ctl);border-radius:var(--r-ctl);background:var(--card);font-size:16px}
.field input:focus-visible{outline:3px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.pair{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.bubble{display:block;width:100%;padding:12px 14px;border:0;border-radius:16px 16px 16px 4px;background:var(--sage);color:var(--ink);font-size:14px;line-height:1.45;resize:none;white-space:pre-wrap;overflow:hidden}
.bubble:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.copy-msg{min-height:1.2em;margin-top:8px;font-size:var(--t-sm);font-weight:700;color:var(--sage-ink);text-align:center}
.wa-note{display:flex;gap:8px;margin-top:12px;font-size:var(--t-xs);color:var(--muted)}

/* glosario e info */
.photo{width:100%;height:150px;object-fit:cover;border-radius:14px}
.v-glossary .sh-title,.v-info .sh-title{margin-top:14px}
.gloss{display:grid;gap:8px;margin-top:14px}
.gloss li{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:12px;background:var(--paper)}
.gloss svg{width:56px;height:56px}
.gloss b{display:block;font-weight:800}
.gloss p{font-size:var(--t-md);color:var(--muted);line-height:1.4}
.h3{margin-top:20px;font-family:var(--f-round);font-weight:700;font-size:var(--t-lg)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.steps li{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:12px;background:var(--sage);color:var(--sage-ink);font-size:var(--t-sm);font-weight:700;line-height:1.25;text-align:center}
.steps .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card);color:var(--ink);font-weight:800}
.facts{display:grid;gap:14px;margin-top:14px}
.facts li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.facts .dt{font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts .dd{font-size:var(--t-md);line-height:1.4}
.facts .ic{margin-top:2px;color:var(--sage-ink)}
.lnk-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:4px;padding:0 14px;border-radius:var(--r-pill);background:var(--sage);color:var(--sage-ink);font-size:var(--t-sm);font-weight:800;text-decoration:none}
.merch{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;margin-top:18px;padding:10px;border-radius:var(--r-card);background:var(--paper)}
.merch img{width:96px;height:96px;object-fit:cover;object-position:60% 30%;border-radius:10px}
.merch h3{font-weight:800}
.merch p{font-size:var(--t-sm);color:var(--muted)}
.tagline{margin-top:6px;font-family:var(--f-round);font-weight:700;color:var(--sage-ink)}

@media (max-width:359px){
  :root{--gut:12px}
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dk-hero{grid-template-columns:88px minmax(0,1fr)}
  .dk-cup{width:88px;height:128px}
  .t-koi .t-cup{width:62px}
  .t-koi .t-name{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:120ms!important;transition-property:opacity,background-color,color,box-shadow!important;scroll-behavior:auto!important}
  .sheet,.layer.on .sheet,.toast,.toast.on{transform:none!important}
}

/* Ajustes de revisión */
.tk-code{white-space:nowrap;font-size:clamp(44px,16vw,64px)}
.tk-total .num{display:flex;flex-direction:column;align-items:flex-end}
.tk-usd{font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.t-koi .t-price{right:62px;white-space:nowrap}
@media (max-width:380px){.t-koi .t-price{font-size:16px}}
.tile:focus-visible,.t-koi:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px #fff}
.tchip .lab{overflow-wrap:anywhere;hyphens:auto}
.foot-photo img{transform:none;object-position:50% 40%}
</style>
</head>
<body>
<div class="layer" id="layer" hidden>
  <div class="scrim" data-a="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-bar" id="sheetBar"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand">
      <img class="logo" src="img/logo.jpg" alt="" width="42" height="42">
      <h1 class="wordmark"><span class="wm">Koi Tea</span><span class="wm-sub" id="wmSub">Boba shop</span></h1>
    </div>
    <div class="toggles">
      <div class="seg" role="group" id="gLang">
        <button type="button" data-a="lang" data-v="es" data-tid="lang-es" data-testid="lang-es" lang="es" aria-pressed="true">ES</button>
        <button type="button" data-a="lang" data-v="en" data-tid="lang-en" data-testid="lang-en" lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="seg" role="group" id="gCur">
        <button type="button" data-a="cur" data-v="mxn" data-tid="cur-mxn" data-testid="cur-mxn" aria-pressed="true">MXN</button>
        <button type="button" data-a="cur" data-v="usd" data-tid="cur-usd" data-testid="cur-usd" aria-pressed="false">USD</button>
      </div>
    </div>
  </header>
  <main id="main">
    <section class="intro" id="intro"></section>
    <section class="today" id="today" aria-labelledby="todayTitle"></section>
    <section class="menu" id="menu" aria-labelledby="menuTitle">

function measure() { html.style.setProperty('--topbar', $('#top').offsetHeight + 'px'); stick(); }
/* pestañas: se fijan (position:fixed) al llegar a la barra superior; un marcador conserva su lugar */
function stick() {
  var nav = $('#tabs'), ph = $('#tabsPh'), on = nav.classList.contains('stuck');
  if (nav.hidden) { if (on) { nav.classList.remove('stuck'); ph.hidden = true; } return; }
  var should = (on ? ph : nav).getBoundingClientRect().top <= $('#top').offsetHeight;
  if (should !== on) { if (should) ph.style.height = nav.offsetHeight + 'px'; nav.classList.toggle('stuck', should); ph.hidden = !should; }
}
function spy() {
  var nav = $('#tabs'); if (nav.hidden) return;
  var line = $('#top').offsetHeight + nav.offsetHeight + 24, secs = $$('#list .cat'), cur = secs.length ? secs[0].dataset.cat : null;
  secs.forEach(function (s) { if (s.getBoundingClientRect().top - line <= 0) cur = s.dataset.cat; });
  setTab(cur);
}
function setTab(id) {

  $$('#tabs .tab').forEach(function (b) { if (b.dataset.cat === id) { b.setAttribute('aria-current', 'true'); act = b; } else b.removeAttribute('aria-current'); });
  var ink = $('#tabInk');
  if (ink && act) { ink.style.width = (act.offsetWidth - 20) + 'px'; ink.style.transform = 'translateX(' + (act.offsetLeft + 10) + 'px)'; }
  if (act && id !== S.activeCat) {
    S.activeCat = id; var sc = $('#tabsScroll');
    if (sc && (act.offsetLeft < sc.scrollLeft || act.offsetLeft + act.offsetWidth > sc.scrollLeft + sc.clientWidth)) sc.scrollTo({ left: Math.max(0, act.offsetLeft - 16), behavior: rm() ? 'auto' : 'smooth' });
  }
}
var ticking = false;
window.addEventListener('scroll', function () {
  if (ticking) return; ticking = true;

}, { passive: true });

/* ---------- capa de hojas con pila (foco, Escape, scroll lock) ---------- */
var layer = $('#layer'), sheet = $('#sheet'), sBar = $('#sheetBar'), sBody = $('#sheetBody'), sFoot = $('#sheetFoot'), app = $('#app'), qIn = $('#q');

/* Evita toques fantasma: si una capa se abrió o cerró hace menos de 350 ms, el segundo toque se ignora. */
(function () { var last = 0, sig = ''; function cur() { return S.stack.map(function (x) { return x.view; }).join('|') + (layer.classList.contains('on') ? '+' : '-'); }

doc.addEventListener('keydown', function (e) {

    if (e.key === 'Tab') {

/* deslizar hacia abajo desde la barra de la hoja para cerrarla */
(function () {
  var y0 = null, dy = 0;

/* ---------- acciones ---------- */
function refresh(el) {
  var tid = el.getAttribute('data-testid') || el.getAttribute('data-tid');
  renderTop(); renderIntro(); renderToday(); renderFilters(); renderList(); renderFoot(); renderBar(false);
  if (S.toast) renderToast();
  measure();
  if (S.stack.length) renderSheet({ keep: true, focus: '[data-testid="' + tid + '"]' });
}
function openDrink(id, el, editKey) {
  var d = K.drink(id); if (!d) return;
  var line = editKey ? S.cart.filter(function (l) { return l.key === editKey; })[0] : null;
  S.draft = { id: id, cfg: line ? clone(line.cfg) : K.defaultConfig(d), qty: line ? line.qty : 1, editKey: line ? line.key : null, msg: null };
  push('drink', el);
}
function redraw(el) {
  var up = $('#unitPrice'), before = up ? up.textContent : '';
  renderSheet({ keep: true, focus: '[data-testid="' + el.getAttribute('data-testid') + '"]' });
  up = $('#unitPrice'); if (up && up.textContent !== before && !rm()) up.classList.add('tick');
}
function toggleTop(id, el) {
  var c = S.draft.cfg, i = c.toppings.indexOf(id);
  if (i >= 0) { c.toppings.splice(i, 1); S.draft.msg = null; }
  else if (c.toppings.length >= K.meta.maxToppings) S.draft.msg = 'max';
  else { c.toppings.push(id); S.draft.msg = null; }
  redraw(el);
}
function replaceLine(lines, oldKey, id, cfg, qty) {
  var idx = -1; lines.forEach(function (l, i) { if (l.key === oldKey) idx = i; });
  var rest = lines.filter(function (l) { return l.key !== oldKey; }), nk = K.lineKey(id, cfg);
  var merged = rest.some(function (l) { return l.key === nk; }), out = K.addToCart(rest, id, cfg, qty);
  if (!merged && idx >= 0) { var nl = out.pop(); out.splice(Math.min(idx, out.length), 0, nl); }
  return out;
}
function quickAdd(id, btn) {
  var d = K.drink(id); if (!d || d.soldOut) return;
  var cfg = K.defaultConfig(d);
  S.cart = clampQ(K.addToCart(S.cart, id, cfg, 1));
  doneMark(btn); fly(btn.getBoundingClientRect(), d.colors.main);
  setTimeout(function () { renderBar(true); }, rm() ? 0 : 230);

  announce(t('addedAnn', { name: nm(d), n: K.cartCount(S.cart) }));
}
function addFromSheet(btn) {
  var dr = S.draft, d = K.drink(dr.id); if (!d || d.soldOut) return;
  var cfg = clone(dr.cfg), rect = btn.getBoundingClientRect(), under = S.stack.length > 1;
  S.cart = clampQ(dr.editKey ? replaceLine(S.cart, dr.editKey, d.id, cfg, dr.qty) : K.addToCart(S.cart, d.id, cfg, dr.qty));
  closeTop();
  if (under) { renderBar(false); announce(t('saved')); return; }
  fly(rect, d.colors.main);
  setTimeout(function () { renderBar(true); }, rm() ? 0 : 230);
  if (dr.editKey) showToast({ kind: 'msg', msg: 'saved' });
  else showToast({ kind: 'added', id: d.id, cfg: cfg, key: K.lineKey(d.id, cfg) });
  announce(dr.editKey ? t('saved') : t('addedAnn', { name: nm(d), n: K.cartCount(S.cart) }));
}
function clampQ(c) { return c.map(function (l) { return l.qty > 20 ? { key: l.key, id: l.id, cfg: l.cfg, qty: 20 } : l; }); }
function lineAct(a, key) {
  var l = null, idx = -1;
  S.cart.forEach(function (x, i) { if (x.key === key) { l = x; idx = i; } }); if (!l) return;
  var q = a === 'lrem' ? 0 : (a === 'linc' ? Math.min(20, l.qty + 1) : l.qty - 1);
  S.undo = q === 0 ? { line: { key: l.key, id: l.id, cfg: clone(l.cfg), qty: l.qty }, idx: idx } : null;
  S.cart = K.setQty(S.cart, key, q);
  if (!S.cart.length) S.code = null;
  var still = S.cart.some(function (x) { return x.key === key; });
  renderSheet({ keep: true, focus: still ? '[data-a="' + a + '"][data-key="' + key + '"]' : null });
  renderBar(false);
  var d = K.drink(l.id);
  announce(still ? nm(d) + ': ' + q : t('undone', { name: nm(d) }));
}
function personalize(key, el) {
  var l = S.cart.filter(function (x) { return x.key === key; })[0], id = l ? l.id : S.toast && S.toast.id;
  hideToast(); if (id) openDrink(id, el, l ? key : null);
}
function undo() {
  var u = S.undo; if (!u) return; S.undo = null;
  var ex = S.cart.filter(function (x) { return x.key === u.line.key; })[0];
  if (ex) S.cart = K.setQty(S.cart, ex.key, Math.min(20, ex.qty + u.line.qty));
  else { var out = S.cart.slice(); out.splice(Math.min(u.idx, out.length), 0, u.line); S.cart = out; }
  renderSheet({ keep: true }); renderBar(false); announce(nm(K.drink(u.line.id)) + ': ' + u.line.qty);

function toCounter(el) { if (!S.cart.length) return; S.code = S.code || K.orderCode(); saveLast(); push('counter', el); }
function toWa(el) { if (!S.cart.length) return; S.code = S.code || K.orderCode(); push('wa', el); }
function newOrder() {
  saveLast(); S.cart = []; S.code = null; S.wa = { name: '', time: '' };

  showToast({ kind: 'msg', msg: 'newDone' }); announce(t('newDone'));
}
function fitMsg() { var ta = $('#waMsg'); if (!ta) return; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function copyMsg(btn) {
  var ta = $('#waMsg'), txt = ta ? ta.value : '', out = $('#copyMsg'), lab = btn.querySelector('span');
  function ok() { out.textContent = t('copied'); lab.textContent = S.lang === 'en' ? 'Copied!' : '¡Copiado!'; saveLast(); setTimeout(function () { if (lab.isConnected) lab.textContent = t('copy'); }, 2600); }
  function fail() { ta.focus(); ta.select(); try { ta.setSelectionRange(0, txt.length); } catch (x) {} out.textContent = t('copyFail'); }

function saveLast() {

  S.last.lines.forEach(function (l) { var d = K.drink(l.id); if (d.soldOut) { skipped.push(nm(d)); return; } S.cart = K.addToCart(S.cart, l.id, sanitize(d, l.cfg), Math.min(20, l.qty)); });
  renderSheet({}); renderBar(true);
  announce(t('repeated') + (skipped.length ? '. ' + t('skipped', { name: skipped.join(', ') }) : ''));

function setQ(v, fromInput) {

  renderList();
  clearTimeout(S.annT); S.annT = setTimeout(announceCount, 500);
}
function announceCount() { var n = results().length; announce(n ? t('nOf', { n: n }) : norm(S.q) ? t('noQ', { q: S.q.trim() }) : t('noF')); }
function toggleF(id) {
  S.f[id] = !S.f[id];
  if (id === 'milk' && S.f.milk) S.f.nomilk = false;
  if (id === 'nomilk' && S.f.nomilk) S.f.milk = false;

function clearAll() { S.f = {}; setQ(''); renderFilters(); renderList(); }
function scrollToEl(el, extra) { if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - $('#top').offsetHeight - (extra || 0), behavior: rm() ? 'auto' : 'smooth' }); }
function revTile() { S.f = { resena: true }; setQ(''); renderFilters(); renderList(); scrollToEl($('#menuHead'), 4); announceCount(); }
function jumpQ() { scrollToEl($('#searchBox'), 70); qIn.focus({ preventScroll: true }); }

  s.scrollIntoView({ behavior: rm() ? 'auto' : 'smooth', block: 'start' }); setTab(cat);

doc.addEventListener('click', function (e) {

  switch (a) {
    case 'lang': if (S.lang !== v) { S.lang = v; refresh(el); } break;
    case 'cur': if (S.cur !== v) { S.cur = v; refresh(el); } break;
    case 'open': openDrink(id, el); break;
    case 'quick': quickAdd(id, el); break;
    case 'cart': push('cart', el); break;
    case 'filter': toggleF(el.getAttribute('data-f')); break;

    case 'qinc': S.draft.qty = Math.min(20, S.draft.qty + 1); redraw(el); break;
